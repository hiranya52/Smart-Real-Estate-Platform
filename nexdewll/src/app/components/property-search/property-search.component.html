<!-- Search Section -->
<section class="search-section" id="search">
    <div class="search-container">
        <div class="search-header">
            <h2 class="search-title">We help you find the home that will be yours</h2>
            <p class="search-subtitle">Our property advisors will assist you with your search</p>
        </div>
        <div class="search-filters">
            <div class="filter-group">
                <label>Property Type</label>
                <select>
                    <option>All Properties</option>
                    <option>Houses</option>
                    <option>Apartments</option>
                    <option>Villas</option>
                    <option>Commercial</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Location</label>
                <select>
                    <option>All Locations</option>
                    <option>Downtown</option>
                    <option>Suburbs</option>
                    <option>Beachfront</option>
                    <option>Mountain View</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Price Range</label>
                <select>
                    <option>$0 - $500,000</option>
                    <option>$500,000 - $1,000,000</option>
                    <option>$1,000,000+</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Bedrooms</label>
                <select>
                    <option>Any</option>
                    <option>1 Bedroom</option>
                    <option>2 Bedrooms</option>
                    <option>3+ Bedrooms</option>
                </select>
            </div>
        </div>
        <button class="search-button">Show Properties</button>
    </div>
</section>
